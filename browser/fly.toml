# Self-hosted browser-use worker for Outbound's LinkedIn actions (see worker.py).
app = "threadline-browser"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BROWSER_MODEL = "anthropic/claude-haiku-5.5"

[[mounts]]
  source = "browser_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Runs continue after the request that queued them; a stopped machine would cut them off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
